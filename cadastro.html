<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Acerte a Toupeira</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="registration">
    <header>
        <img src="assets/img/toupeira1.png" alt="Toupeira pixel art" class="logo-header">
        <h1>ACERTE A TOUPEIRA</h1>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Entrar</a></li>
                <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
                <li><a href="jogo.html">Jogo</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="ranking.html">Ranking</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>CADASTRO DE JOGADOR</h2>
            <form id="registration-form">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">CRIAR JOGADOR</button>
            </form>
            <p id="registration-message" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/cadastro.js" defer></script>
</body>
</html>
