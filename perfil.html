<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Acerte a Toupeira</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="assets/img/toupeira2.png" alt="Toupeira pixel art" class="logo-header">
        <h1>MEU PERFIL</h1>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Entrar</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="jogo.html">Jogo</a></li>
                <li><a href="perfil.html" aria-current="page">Perfil</a></li>
                <li><a href="ranking.html">Ranking</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="perfil-card">
            <h2>INFORMAÇÕES DO JOGADOR</h2>
            <div class="perfil-info">
                <p><strong>Nome:</strong> Visitante</p>
                <p><strong>Username:</strong> não definido</p>
                <p><strong>E-mail:</strong> não informado</p>
                <p><strong>Data de nascimento:</strong> não informada</p>
                <p><strong>Telefone:</strong> não informado</p>
                <p><strong>CPF:</strong> não informado</p>
            </div>
        </section>
        <section>
            <h2>EDITAR INFORMAÇÕES</h2>
            <form id="profile-form">
                <label for="profile-name">Nome completo</label>
                <input type="text" id="profile-name" name="nome" required>

                <label for="profile-email">E-mail</label>
                <input type="email" id="profile-email" name="email" required>

                <label for="profile-phone">Telefone</label>
                <input type="tel" id="profile-phone" name="telefone" required>

                <label for="profile-birth">Data de nascimento</label>
                <input type="text" id="profile-birth" value="Não informada" readonly>

                <label for="profile-cpf">CPF</label>
                <input type="text" id="profile-cpf" value="Não informado" readonly>

                <label for="profile-username">Username</label>
                <input type="text" id="profile-username" value="Não definido" readonly>

                <button type="submit">SALVAR ALTERAÇÕES</button>
            </form>
            <p id="profile-message" role="status" aria-live="polite"></p>
        </section>
        <section>
            <h2>ESTATÍSTICAS E PARTIDAS</h2>
        </section>
    </main>
    <script src="js/perfil.js" defer></script>
</body>
</html>
