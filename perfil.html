<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="assets/img/toupeira1.png" alt="Avatar pixel art" class="logo-header">
        <h1>MINHA FICHA</h1>
        <nav>
            <ul>
                <li><a href="jogo.html">Voltar a partida</a></li>
                <li><a href="ranking.html">High Scores</a></li>
                <li><a href="index.html">Sair do Arcade</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h3>
            <img src="assets/img/prancheta.webp" alt="" class="icon-inline"> DADOS DO JOGADOR
        </h3>
        
        <form action="jogo.html" method="get">
            <label for="username">Username (não pode ser alterado)</label>
            <input type="text" id="username" name="username" value="WolwerineDaFiel" disabled readonly>

            <label for="nascimento">Data de nascimento (não pode ser alterada)</label>
            <input type="date" id="nascimento" name="nascimento" value="1954-02-19" disabled readonly>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" value="Yuri Alberto" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="yuri@gaviaofiel.com" required>

            <label for="senha">Nova senha (opcional)</label>
            <input type="password" id="senha" name="senha" placeholder="******">

            <button type="submit">
                <img src="assets/img/save.webp" alt="" class="icon-inline"> SALVAR ALTERAÇÕES
            </button>
        </form>
    </main>
</body>
</html>
