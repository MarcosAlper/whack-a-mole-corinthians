<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade 8-Bit | Acerte a Toupeira</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-menu">
    <header class="game-menu-header">
        <h1>ACERTE<br>A TOUPEIRA</h1>
        <p class="menu-subtitle">SI401A -Programação para a Web</p>
    </header>
    <main class="login-panel">
        <p class="menu-prompt">&gt;&gt;  PRESS  START  &lt;&lt;</p>
        <h2>FAÇA LOGIN PARA JOGAR</h2>
        <form action="jogo.html" method="post">
            <label for="username">Nome</label>
            <input type="text" id="username" name="username" required placeholder="Digite seu username">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">

            <button type="submit"><img src="assets/img/toupeira1.png" alt="" class="icon-inline"> INICIAR PARTIDA</button>
        </form>
        <p class="register-link">
            Não tem uma conta? <a href="cadastro.html">Crie sua conta</a>   
        </p>
        <p class="menu-footer">COLOQUE UMA FICHA</p>
    </main>
</body>
</html>
