<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Acerte a Toupeira</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <img src="assets/img/toupeira1.png"
             alt="Toupeira pixel art"
             class="logo-header">

        <h1>ACERTE A TOUPEIRA</h1>
    </header>

    <main>

        <section>
            <h2>ENTRAR</h2>

            <form action="jogo.html" method="get">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu username"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    <img
                        src="assets/img/hammer.png"
                        alt=""
                        class="icon-inline"
                    >
                    ENTRAR
                </button>

            </form>

            <p class="eyebrow">
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <footer>
        <p>
            Disciplina: SI401-A / Programação para a Web
        </p>

        <p>
            Integrantes do Grupo: André Brito / Davy Pereira / Lucas Lima / Marcos Almeida / Vitor Cunha
        </p>

        <p>
            Ano/Semestre: 2026/2
        </p>
    </footer>

</body>

</html>
